<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2a4a">
<title>Slovakia Trip 2026 — Interactive Guide</title>
<style>
:root {
  --navy:#0b2a4a; --blue:#155a9c; --green:#20833a; --gold:#d99b16;
  --bg:#f4f6f8; --card:#fff; --text:#17202a; --muted:#607080; --line:#dce3e9;
  --shadow:0 8px 24px rgba(20,35,55,.10);
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#0e1116; --card:#171c22; --text:#f3f6f9; --muted:#aab5c0; --line:#2d3640; --shadow:none; }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:100;background:color-mix(in srgb,var(--navy) 94%,transparent);backdrop-filter:blur(14px);color:white;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid rgba(255,255,255,.12)}
.headrow{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:900px;margin:auto}
.brand{font-weight:800;font-size:16px;line-height:1.15}
.sub{font-size:12px;opacity:.82;margin-top:2px}
.lang{display:flex;background:rgba(255,255,255,.14);padding:3px;border-radius:12px}
.lang button{border:0;background:transparent;color:white;font-weight:800;padding:8px 11px;border-radius:9px}
.lang button.active{background:white;color:var(--navy)}
main{max-width:900px;margin:auto;padding:12px}
.hero,.day,.quicknav{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.heroimg{width:100%;display:block;height:auto;object-fit:contain;background:#fff}
.hero-body{padding:14px}
.hero h1{font-size:24px;line-height:1.12;margin:0 0 6px}
.hero p{color:var(--muted);margin:0 0 12px;line-height:1.45}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:white;background:var(--blue);padding:12px 10px;border-radius:12px;font-weight:750;font-size:14px;min-height:44px}
.btn.secondary{background:var(--navy)}
.btn.green{background:var(--green)}
.quicknav{padding:12px}
.quicknav-title{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px}
.chips{display:flex;overflow-x:auto;gap:8px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;text-decoration:none;color:var(--text);border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 12px;font-size:13px;font-weight:750}
.day-summary{padding:13px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.datebox{min-width:68px;background:var(--navy);color:white;border-radius:13px;padding:8px 7px;text-align:center;font-weight:900;font-size:12px}
.daytitle{flex:1;min-width:0}
.daytitle h2{margin:0;font-size:18px;line-height:1.17}
.daytitle .tag{margin-top:4px;color:var(--muted);font-size:13px}
.chev{font-size:22px;color:var(--muted);transition:.2s}
.day.open .chev{transform:rotate(180deg)}
.day-content{display:none;border-top:1px solid var(--line)}
.day.open .day-content{display:block}
.gallery{display:flex;overflow-x:auto;gap:8px;padding:10px;scroll-snap-type:x mandatory;scrollbar-width:none}
.gallery::-webkit-scrollbar{display:none}
.gallery img{scroll-snap-align:start;width:82%;max-width:500px;aspect-ratio:16/10;object-fit:cover;border-radius:14px;border:1px solid var(--line);flex:0 0 auto}
.section{padding:12px 14px;border-top:1px solid var(--line)}
.section:first-of-type{border-top:0}
.section h3{font-size:13px;color:var(--navy);text-transform:uppercase;letter-spacing:.04em;margin:0 0 9px}
@media (prefers-color-scheme: dark) { .section h3{color:#81b9ef} }
.timeline{display:grid;gap:8px}
.trow{display:grid;grid-template-columns:88px 1fr;gap:8px;align-items:start}
.time{font-weight:800;color:var(--navy);font-size:13px}
@media (prefers-color-scheme: dark) { .time{color:#9cc9f4} }
.desc{font-size:14px;line-height:1.42}
.linkgrid{display:grid;grid-template-columns:1fr;gap:8px}
.mapbtn{text-decoration:none;color:var(--text);border:1px solid var(--line);padding:11px 12px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;font-weight:750;font-size:14px;background:color-mix(in srgb,var(--card) 96%,var(--blue) 4%)}
.mapbtn span:last-child{color:var(--blue);font-size:18px}
.offbtn{background:var(--green);color:white;border:0}
.note{font-size:12px;color:var(--muted);line-height:1.45}
footer{max-width:900px;margin:20px auto 0;padding:0 14px;color:var(--muted);font-size:12px;line-height:1.5;text-align:center}
.fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));width:48px;height:48px;border-radius:50%;border:0;background:var(--navy);color:white;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:20px;z-index:80}
@media(min-width:700px){.gallery img{width:48%} .linkgrid{grid-template-columns:1fr 1fr} .buttons{grid-template-columns:repeat(3,1fr)}}
</style>

function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}

function renderRouteButtons(){
  const box=document.getElementById('routeButtons'); box.innerHTML='';
  SEGMENTS.forEach(([label,url],i)=>{
    const a=document.createElement('a'); a.href=url; a.target='_blank'; a.rel='noopener';
    a.className='btn '+(i===SEGMENTS.length-1?'green':'');
    a.textContent=(LANG==='ru'?'🚗 ':'🚗 ')+label;
    box.appendChild(a);
  });
}

function renderChips(){
  const chips=document.getElementById('chips'); chips.innerHTML='';
  DAYS.forEach(d=>{
    const a=document.createElement('a'); a.href='#'+d.id; a.className='chip';
    a.textContent=(LANG==='ru'?d.date_ru:d.date_en)+' · '+(LANG==='ru'?d.title_ru:d.title_en);
    chips.appendChild(a);
  });
}

function renderDays(){
  const root=document.getElementById('days'); root.innerHTML='';

    const el=document.createElement('section'); el.className='day'+(idx===0?' open':''); el.id=d.id;
    const date=LANG==='ru'?d.date_ru:d.date_en, title=LANG==='ru'?d.title_ru:d.title_en, tag=LANG==='ru'?d.tag_ru:d.tag_en;
    el.innerHTML=`
      <div class="day-summary" onclick="this.parentElement.classList.toggle('open')">

        <div class="daytitle"><h2>${esc(title)}</h2><div class="tag">${esc(tag)}</div></div>

      <div class="day-content">

        <div class="section"><h3>${T[LANG].plan}</h3><div class="timeline">
          ${(LANG==='ru'?d.plan_ru:d.plan_en).map(([t,x])=>`<div class="trow"><div class="time">${esc(t)}</div><div class="desc">${esc(x)}</div></div>`).join('')}
        </div></div>
        <div class="section"><h3>${T[LANG].maps}</h3><div class="linkgrid">
          ${d.maps.map(([n,u])=>`<a class="mapbtn" target="_blank" rel="noopener" href="${u}"><span>${esc(n)}</span><span>↗</span></a>`).join('')}
        </div></div>
        ${d.official && d.official.length?`<div class="section"><h3>${T[LANG].official}</h3><div class="linkgrid">

    root.appendChild(el);
  });
}

function setLang(lang){
  LANG=lang; document.documentElement.lang=lang;
  document.getElementById('ruBtn').classList.toggle('active',lang==='ru');
  document.getElementById('enBtn').classList.toggle('active',lang==='en');
  document.getElementById('headerSub').textContent=T[lang].header;
  document.getElementById('quickTitle').textContent=T[lang].quick;
  document.getElementById('driveTitle').textContent=T[lang].drives;
  document.getElementById('footerText').textContent=T[lang].footer;
  document.getElementById('heroMap').src=ROUTE_MAPS[lang];
  renderRouteButtons(); renderChips(); renderDays();
  localStorage.setItem('slovakiaLang',lang);
}
try{const saved=localStorage.getItem('slovakiaLang'); if(saved==='en') LANG='en';}catch(e){}
setLang(LANG);
</script>
